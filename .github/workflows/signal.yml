name: XAUUSD Signal - Telegram Push (备用)

on:
  workflow_dispatch:   # 仅手动触发（Render 为主，GitHub Actions 为备用）
    inputs:
      symbol:
        description: '交易品种 (XAUUSD / BTCUSDT)'
        required: false
        default: 'XAUUSD'
        type: choice
        options:
          - XAUUSD
          - BTCUSDT

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests pytz

      - name: 推送信号
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SIGNAL_CID:        ${{ secrets.SIGNAL_CID }}
        run: python ai_signals.py ${{ github.event.inputs.symbol || 'XAUUSD' }}
