name: XAUUSD Signal - Manual Backup Push

on:
  workflow_dispatch:   # 仅手动触发（Render 为主，此为备用）

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz

      - name: Push XAUUSD signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SIGNAL_CID: ${{ secrets.SIGNAL_CID }}
          CHINESE_CID: ${{ secrets.CHINESE_CID }}
        run: python ai_signals.py XAUUSD
