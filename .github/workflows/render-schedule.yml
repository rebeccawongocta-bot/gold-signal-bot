name: Render Schedule (Wake/Pause)

# 周末休眠节省 Render 免费时长
# 周一 05:30 CST 唤醒 → 周六 07:00 CST 暂停
# GitHub Actions cron 使用 UTC 时间

on:
  schedule:
    # 周一 05:30 CST = 周日 21:30 UTC — 唤醒 Render
    - cron: '30 21 * * 0'
    # 周六 07:00 CST = 周五 23:00 UTC — 暂停 Render
    - cron: '0 23 * * 5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'resume'
        type: choice
        options:
          - resume
          - suspend

jobs:
  resume:
    if: github.event.inputs.action == 'resume' || github.event.schedule == '30 21 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Resuming Render service..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Render service resumed successfully"
          else
            echo "❌ Failed to resume Render service"
            exit 1
          fi

  suspend:
    if: github.event.inputs.action == 'suspend' || github.event.schedule == '0 23 * * 5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Suspend Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Suspending Render service..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Render service suspended successfully"
          else
            echo "❌ Failed to suspend Render service"
            exit 1
          fi
