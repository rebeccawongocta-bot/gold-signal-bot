name: Render Wake (Monday)

# 每周一 05:30 CST (周日 21:30 UTC) 自动唤醒 Render 服务
# Render 免费版收到 HTTP 请求会自动冷启动
# 周末暂停由 bot_combined.py 自动完成（休市提醒后自我 suspend）

on:
  schedule:
    # 周日 21:30 UTC = 周一 05:30 CST
    - cron: '30 21 * * 0'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up Render service
        run: |
          echo "Waking up Render service..."
          # 第一次请求触发冷启动
          curl -s --max-time 60 "https://gold-signal-bot-wrk9.onrender.com/" || echo "Cold start in progress..."
          # 等 60 秒让服务完全启动
          sleep 60
          # 第二次请求验证
          echo "Verifying service is up..."
          curl -sf --max-time 10 "https://gold-signal-bot-wrk9.onrender.com/" && echo "✅ Service is live" || echo "❌ Service may need more time"
